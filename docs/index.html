<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Création — Rafael × Bram</title>
  <meta name="description" content="Cibles de création musicale : Rafael (YouTube likes), Bram (Spotify Chill), et brief à deux." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #5b9fd4;
      --accent-soft: rgba(91, 159, 212, 0.14);
      --line: #2a3542;
      --ok: #6db89a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3048 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #1e2438 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 72px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 0 0 18px; max-width: 56ch; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
    }
    .tab {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tab.active {
      color: var(--text);
      border-color: rgba(91, 159, 212, 0.55);
      background: var(--accent-soft);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr !important; }
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px;
    }
    .stat strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
      word-break: break-word;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .callout {
      background: var(--accent-soft);
      border: 1px solid rgba(91, 159, 212, 0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .callout.ok {
      background: rgba(109, 184, 154, 0.12);
      border-color: rgba(109, 184, 154, 0.35);
    }
    .callout h2 { margin: 0 0 6px; font-size: 0.92rem; color: var(--accent); }
    .callout.ok h2 { color: var(--ok); }
    .callout.warn {
      background: rgba(212, 163, 91, 0.12);
      border-color: rgba(212, 163, 91, 0.35);
    }
    .callout.warn h2 { color: #d4a35b; }
    .callout ul { margin: 8px 0 0; padding-left: 1.1rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 12px; font-size: 0.92rem; font-weight: 600; }
    .chart-box { position: relative; height: 230px; }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
    h2.sec {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem;
      margin: 22px 0 12px;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 520px; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    footer {
      margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.82rem;
    }
    footer a { color: var(--accent); }
    .err { color: #f0a0a0; padding: 24px; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="sub">Chargement…</p>
  </div>
  <script>
    const accent = "#5b9fd4";
    const muted = "#8b9aab";
    const grid = "#2a3542";
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = grid;
    Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";

    const charts = [];
    function clearCharts() {
      while (charts.length) {
        try { charts.pop().destroy(); } catch (_) {}
      }
    }
    function bar(id, labels, data, horizontal = false) {
      const el = document.getElementById(id);
      if (!el) return;
      charts.push(new Chart(el, {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "count", data, backgroundColor: accent, borderRadius: 6 }],
        },
        options: {
          indexAxis: horizontal ? "y" : "x",
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, ticks: { precision: 0 }, grid: { display: horizontal } },
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { display: !horizontal } },
          },
        },
      }));
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    async function loadProfile() {
      const urls = [
        "./music_profile.json",
        "music_profile.json",
        "https://raw.githubusercontent.com/rafa-create/youtube_likes_mp3/main/music_profile.json",
        "https://cdn.jsdelivr.net/gh/rafa-create/youtube_likes_mp3@main/music_profile.json",
      ];
      let lastErr;
      for (const url of urls) {
        try {
          const sep = url.includes("?") ? "&" : "?";
          const res = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error(res.status + " " + url);
          return await res.json();
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("profil introuvable");
    }

    const GAYTITUDE = {
      rafael: {
        score: 81,
        label: "Très sensitive-pop",
        rows: [
          ["Mode mineur (58%)", "16.2", "423/726 pistes mineures — couleur introspective"],
          ["Soft vocals / piano / chanson", "18.5", "Voix 108 + piano 49 + FR chanson 33 + neo-classical 44"],
          ["Artistes sensibles", "17.2", "Sia, Pomme, HAEVN, Tom Odell, Alec Benjamin, Sheeran…"],
          ["Moods mélancoliques", "15.0", "Intime/sombre + électro-mélancolie ≈ 45% des quadrants"],
          ["Anti-club (100−hard)", "14.1", "EDM présent mais pas dominant vs émotion midtempo"],
        ],
      },
      bram: {
        score: 57,
        label: "Chill sensible, pas drama-pop",
        rows: [
          ["Soft acoustic / intimacy", "18.0", "Guitare + voix soft = cœur Chill (Johnson, Bahamas, Mayer)"],
          ["Artistes sensibles", "11.0", "Mayer / Froukje / soft alt — Jack Johnson = beach-bro chill"],
          ["Tempo lent émotionnel", "14.0", "~90 BPM → écoute corporelle douce, pas flex"],
          ["Blues/soul vulnerability", "8.0", "Keb' Mo', Kiwanuka-adjacent pocket"],
          ["Anti-club", "6.0", "Quasi zéro EDM — le « dude with a guitar » baisse le score gay-coded"],
        ],
      },
      duo: {
        score: 69,
        label: "Duo émotionnellement bilingue",
        rows: [
          ["Moyenne pondérée R/B", "69.0", "0.6×81 (Rafael) + 0.4×57 (Bram) — Rafael tire vers sensitive-pop"],
        ],
      },
    };

    function gaytitudeHtml(who) {
      const g = GAYTITUDE[who];
      return `
        <h2 class="sec">Indice de Gaytitude (IG)</h2>
        <div class="stats">
          <div class="stat"><strong>${g.score}%</strong><span>IG · blague scientifique</span></div>
          <div class="stat"><strong>${esc(g.label)}</strong><span>Lecture comique</span></div>
        </div>
        <div class="callout warn">
          <h2>Avertissement (très sérieux)</h2>
          <p>L'IG estime une affinité pour la musique soft / sensitive / émotionnelle (stéréotype pop-culture « gay listening » ou « sensitive female lead »), <strong>pas</strong> une orientation sexuelle. Formule comique, reproductible, discutable.</p>
          <p class="hint" style="margin-top:8px">IG = 0.28·Mineur% + 0.22·SoftVocals + 0.20·ArtistesSensibles + 0.15·MoodMélancolique + 0.15·(100−ClubHard)</p>
        </div>
        <div class="card">
          <h3>Pourquoi ces stats ?</h3>
          <div class="table-wrap"><table>
            <thead><tr><th>Composante</th><th>Pts</th><th>Pourquoi</th></tr></thead>
            <tbody>${g.rows.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody>
          </table></div>
        </div>`;
    }

    function render(p) {
      const chords = p.chord_progressions || {};
      const recipes = (chords.creation_recipes || []).slice(0, 6);
      const loops = (chords.top_chord_loops || []).slice(0, 8);
      const langs = (chords.languages || []).slice(0, 5);
      const tempos = (chords.tempo_buckets || []).slice(0, 5);
      const bram = p.bram || {};
      const bRecipes = (bram.creation_recipes || []).slice(0, 4);
      const bArtists = (bram.top_artists || []).slice(0, 8);
      const bStyles = (bram.style_signals || []).slice(0, 5);
      const bLangs = (bram.languages || []).slice(0, 4);
      const topR = recipes[0];

      document.getElementById("app").innerHTML = `
        <h1>Création — Rafael × Bram</h1>
        <p class="sub">Analyse playlists + briefs studio · Indice de Gaytitude (blague scientifique) · mobile OK</p>

        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="rafael">Rafael (YouTube)</button>
          <button class="tab" data-tab="bram">Bram (Spotify Chill)</button>
          <button class="tab" data-tab="duo">À deux</button>
        </div>

        <div class="panel active" id="panel-rafael">
          <div class="stats">
            <div class="stat"><strong>${esc(topR?.chords || loops[0]?.name || "—")}</strong><span>Suite #1</span></div>
            <div class="stat"><strong>${esc(topR?.bpm_median ?? p.bpm_stats?.median ?? "—")}</strong><span>BPM</span></div>
            <div class="stat"><strong>${esc(langs[0]?.name || "en")}</strong><span>Langue</span></div>
            <div class="stat"><strong>81%</strong><span>Gaytitude IG</span></div>
          </div>
          ${gaytitudeHtml("rafael")}
          <div class="callout">
            <h2>Brief Rafael</h2>
            <ul>${(p.insights || []).slice(0, 4).map((i) => `<li>${esc(i)}</li>`).join("")}</ul>
          </div>
          <div class="card">
            <h3>Recettes suite × tempo × langue</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Suite</th><th>Degrés</th><th>BPM</th><th>Langue</th><th>Vu</th></tr></thead>
              <tbody>
                ${recipes.map((r) => `<tr>
                  <td><strong>${esc(r.chords)}</strong></td>
                  <td>${esc(r.degrees || "—")}</td>
                  <td>${esc(r.bpm_median ?? "—")}</td>
                  <td>${esc(r.language || "—")}</td>
                  <td>${esc(r.count)}×</td>
                </tr>`).join("")}
              </tbody>
            </table></div>
            <p class="hint">${esc(chords.coverage_note || "")}</p>
          </div>
          <div class="grid-2">
            <div class="card"><h3>Suites</h3><div class="chart-box"><canvas id="rLoops"></canvas></div></div>
            <div class="card"><h3>Langues</h3><div class="chart-box"><canvas id="rLangs"></canvas></div></div>
          </div>
          <div class="card"><h3>Tempos</h3><div class="chart-box"><canvas id="rTempo"></canvas></div></div>
        </div>

        <div class="panel" id="panel-bram">
          <div class="stats">
            <div class="stat"><strong>${esc(bRecipes[0]?.chords || "G–C–D–Em")}</strong><span>Suite #1</span></div>
            <div class="stat"><strong>~${esc(bram.tempo_profile?.median_estimate || 90)}</strong><span>BPM estimé</span></div>
            <div class="stat"><strong>EN ~90%</strong><span>Langue</span></div>
            <div class="stat"><strong>57%</strong><span>Gaytitude IG</span></div>
          </div>
          ${gaytitudeHtml("bram")}
          <div class="callout">
            <h2>Brief Bram — ${esc(bram.name || "Chill")} (${esc(bram.track_count || 270)} titres)</h2>
            <ul>${(bram.insights || []).slice(0, 5).map((i) => `<li>${esc(i)}</li>`).join("")}</ul>
            <p class="hint" style="margin-top:8px"><a href="${esc(bram.source || "https://open.spotify.com/playlist/7prdtzDctYFscp8PgFsp6i")}" style="color:var(--accent)">Playlist Spotify</a></p>
          </div>
          <div class="card">
            <h3>Recettes création</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Suite</th><th>BPM</th><th>Langue</th><th>Instrument</th><th>Recette</th></tr></thead>
              <tbody>
                ${bRecipes.map((r) => `<tr>
                  <td><strong>${esc(r.chords)}</strong></td>
                  <td>${esc(r.bpm_median ?? "—")}</td>
                  <td>${esc(r.language || "—")}</td>
                  <td>${esc(r.instrument || "guitare")}</td>
                  <td>${esc(r.recipe || "")}</td>
                </tr>`).join("")}
              </tbody>
            </table></div>
            <p class="hint">${esc(bram.method || "")}</p>
          </div>
          <div class="grid-2">
            <div class="card"><h3>Artistes</h3><div class="chart-box"><canvas id="bArtists"></canvas></div></div>
            <div class="card"><h3>Styles</h3><div class="chart-box"><canvas id="bStyles"></canvas></div></div>
          </div>
        </div>

        <div class="panel" id="panel-duo">
          <div class="stats">
            <div class="stat"><strong>100–108</strong><span>BPM pont</span></div>
            <div class="stat"><strong>EN (+ FR)</strong><span>Langue</span></div>
            <div class="stat"><strong>69%</strong><span>Gaytitude duo</span></div>
            <div class="stat"><strong>Guit+pad</strong><span>Timbre mix</span></div>
          </div>
          ${gaytitudeHtml("duo")}
          <div class="card"><h3>IG comparé</h3><div class="chart-box"><canvas id="duoIg"></canvas></div>
            <p class="hint">Bram 57% · Duo 69% · Rafael 81% — sensitive-pop accessible, pas club</p>
          </div>
          <div class="callout ok">
            <h2>Pont duo</h2>
            <ul>
              <li>Tempo rencontre : <strong>100–108 BPM</strong> (entre ~90 Bram et ~118 Rafael)</li>
              <li>Langue : <strong>EN</strong> (FR optionnel en pont — Rafael)</li>
              <li>Grilles communes : <strong>C–G–Am–F</strong> ou <strong>Am–F–C–G</strong></li>
              <li>Timbre : guitare Bram + pad/synth Rafael</li>
            </ul>
          </div>
          <div class="card">
            <h3>Qui fait quoi</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Domaine</th><th>Bram</th><th>Rafael</th></tr></thead>
              <tbody>
                <tr><td>Guitare / skeleton</td><td>Mène</td><td>Soutien</td></tr>
                <tr><td>Synth / pads / lift</td><td>—</td><td>Mène</td></tr>
                <tr><td>Voix soft intimiste</td><td>Mène</td><td>Stacks / prod</td></tr>
                <tr><td>Paroles EN</td><td>Oui</td><td>Oui</td></tr>
                <tr><td>Paroles FR</td><td>Support</td><td>Mène (pont)</td></tr>
                <tr><td>Beat</td><td>Shaker / brush</td><td>Kick / clap léger</td></tr>
              </tbody>
            </table></div>
          </div>
          <div class="card">
            <h3>3 concepts prêts</h3>
            <div class="table-wrap"><table>
              <thead><tr><th>Concept</th><th>Grille</th><th>BPM</th><th>Rôles</th></tr></thead>
              <tbody>
                <tr><td>Late light</td><td>C–G–Am–F</td><td>104</td><td>Bram guitare · Rafael pad + clap</td></tr>
                <tr><td>Warm minor</td><td>Am–F–C–G</td><td>100</td><td>EN + pont FR Rafael</td></tr>
                <tr><td>Island lift</td><td>G–Em–C–D</td><td>108</td><td>Bram island · Rafael arpèges</td></tr>
              </tbody>
            </table></div>
          </div>
          <div class="callout">
            <h2>Test de réussite</h2>
            <p>La chanson tient sans synth (test Bram) <em>et</em> sans guitare (test Rafael).</p>
          </div>
        </div>

        <footer>
          Source :
          <a href="https://github.com/rafa-create/youtube_likes_mp3">rafa-create/youtube_likes_mp3</a>
          · Données : music_profile.json
        </footer>
      `;

      document.querySelectorAll(".tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((b) => b.classList.remove("active"));
          document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
          clearCharts();
          paintCharts();
        });
      });

      function paintCharts() {
        const active = document.querySelector(".panel.active")?.id;
        if (active === "panel-rafael") {
          if (loops.length) bar("rLoops", loops.map((x) => x.name), loops.map((x) => x.count), true);
          if (langs.length) bar("rLangs", langs.map((x) => x.name), langs.map((x) => x.count), true);
          if (tempos.length) bar("rTempo", tempos.map((x) => x.name), tempos.map((x) => x.count), false);
        }
        if (active === "panel-bram") {
          if (bArtists.length) bar("bArtists", bArtists.map((x) => x.name), bArtists.map((x) => x.count), true);
          if (bStyles.length) bar("bStyles", bStyles.map((x) => x.name), bStyles.map((x) => x.count), true);
        }
        if (active === "panel-duo") {
          bar("duoIg", ["Bram", "Duo", "Rafael"], [57, 69, 81], false);
        }
      }
      paintCharts();
    }

    loadProfile()
      .then(render)
      .catch((e) => {
        document.getElementById("app").innerHTML =
          `<p class="err">Impossible de charger music_profile.json : ${esc(e.message)}</p>`;
      });
  </script>
</body>
</html>
