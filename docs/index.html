<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil musical — likes YouTube</title>
  <meta name="description" content="Analyse du goût musical à partir des vidéos YouTube aimées : BPM, tonalités, artistes, instruments." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #5b9fd4;
      --accent-soft: rgba(91, 159, 212, 0.14);
      --line: #2a3542;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3048 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #1e2438 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 0 0 28px; max-width: 56ch; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr !important; }
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .stat strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.15;
    }
    .stat span { color: var(--muted); font-size: 0.85rem; }
    .callout {
      background: var(--accent-soft);
      border: 1px solid rgba(91, 159, 212, 0.35);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
    }
    .callout h2 { margin: 0 0 6px; font-size: 0.95rem; color: var(--accent); }
    .callout p { margin: 0; }
    .callout ul { margin: 8px 0 0; padding-left: 1.1rem; color: var(--text); }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .card h3 { margin: 0 0 14px; font-size: 0.95rem; font-weight: 600; }
    .chart-box { position: relative; height: 240px; }
    .chart-box.tall { height: 280px; }
    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
    section > h2 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.35rem;
      margin: 28px 0 14px;
    }
    .pattern h4 { margin: 0 0 4px; font-size: 0.95rem; }
    .pattern p { margin: 0 0 12px; color: var(--muted); font-size: 0.88rem; }
    .pattern p:last-child { margin-bottom: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
    footer {
      margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.85rem;
    }
    footer a { color: var(--accent); }
    .warn {
      background: rgba(212, 163, 91, 0.12);
      border: 1px solid rgba(212, 163, 91, 0.35);
      border-radius: 12px; padding: 14px 16px; font-size: 0.9rem; margin: 16px 0 24px;
    }
    .err { color: #f0a0a0; padding: 24px; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="sub">Chargement du profil…</p>
  </div>

  <script>
    const accent = "#5b9fd4";
    const muted = "#8b9aab";
    const grid = "#2a3542";
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = grid;
    Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";

    function bar(id, labels, data, horizontal = false) {
      new Chart(document.getElementById(id), {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "count", data, backgroundColor: accent, borderRadius: 6 }],
        },
        options: {
          indexAxis: horizontal ? "y" : "x",
          plugins: { legend: { display: false } },
          scales: {
            x: {
              beginAtZero: true,
              ticks: { precision: 0 },
              grid: { display: horizontal },
            },
            y: {
              beginAtZero: true,
              ticks: { precision: 0 },
              grid: { display: !horizontal },
            },
          },
        },
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[c]);
    }

    async function loadProfile() {
      const urls = [
        "https://raw.githubusercontent.com/rafa-create/youtube_likes_mp3/main/music_profile.json",
        "../music_profile.json",
        "https://cdn.jsdelivr.net/gh/rafa-create/youtube_likes_mp3@main/music_profile.json",
      ];
      let lastErr;
      for (const url of urls) {
        try {
          const sep = url.includes("?") ? "&" : "?";
          const res = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error(res.status + " " + url);
          return await res.json();
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("profil introuvable");
    }

    function render(p) {
      const modes = p.modes || [];
      const keys = (p.keys || []).slice(0, 8);
      const artists = (p.top_artists || []).slice(0, 10);
      const genres = (p.genre_signals || []).filter((g) => g.name !== "autre / non classé").slice(0, 7);
      const instruments = (p.instruments || []).slice(0, 7);
      const bpmBuckets = p.bpm_buckets || [];
      const bpmLabels = [];
      const bpmData = [];
      for (const b of bpmBuckets) {
        const m = (b.name || "").match(/^([^ (]+(?:–[^ (]+)?)/);
        bpmLabels.push(m ? m[1] : b.name);
        bpmData.push(b.count);
      }
      const pref = p.preferred_instrument || {};
      const mood = p.mood || {};
      const quadrants = mood.quadrants || [];
      const clusters = p.clusters || [];
      const chords = p.chord_progressions || {};
      const progressions = (chords.top_progressions || []).slice(0, 8);
      const chordExamples = (chords.examples || []).slice(0, 4);
      const insights = p.insights || [];
      const samples = (p.sample_tracks || []).slice(0, 8);
      const minor = modes.find((m) => m.name === "minor")?.count || 0;
      const major = modes.find((m) => m.name === "major")?.count || 0;
      const minorPct = minor + major ? Math.round((100 * minor) / (minor + major)) : 0;
      const topMood = quadrants[0]?.name || "—";
      const topProg = progressions[0]?.name || "—";

      document.getElementById("app").innerHTML = `
        <h1>Profil musical — likes YouTube</h1>
        <p class="sub">
          ${esc(p.playlist_count)} likes / ${esc(p.mp3_count)} MP3 ·
          audio ${esc(p.audio_sample_size)} pistes (${esc(p.audio_coverage_pct)}%) ·
          page dynamique (<code>music_profile.json</code>)
        </p>

        <div class="stats">
          <div class="stat"><strong>${esc(p.bpm_stats?.median ?? "—")}</strong><span>BPM médian</span></div>
          <div class="stat"><strong>${esc(pref.name || "—")}</strong><span>Instrument préféré</span></div>
          <div class="stat"><strong>${esc(topMood)}</strong><span>Mood dominant</span></div>
          <div class="stat"><strong>${esc(topProg)}</strong><span>Progression top (pilote)</span></div>
        </div>

        <div class="callout">
          <h2>Verdict rapide</h2>
          <ul>
            ${insights.slice(0, 6).map((i) => `<li>${esc(i)}</li>`).join("")}
          </ul>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>Mood (quadrants)</h3>
            <div class="chart-box"><canvas id="moodChart"></canvas></div>
            <p class="hint">Valence moy. ${esc(mood.valence_mean)} · ${esc(mood.method || "")}</p>
          </div>
          <div class="card">
            <h3>Clusters de goût</h3>
            <div class="chart-box"><canvas id="clusterChart"></canvas></div>
            <p class="hint">k-means sur BPM / énergie / valence</p>
          </div>
        </div>

        <div class="card">
          <h3>Détail des clusters</h3>
          <table>
            <thead>
              <tr><th>Cluster</th><th>Part</th><th>BPM</th><th>Énergie</th><th>Valence</th><th>% mineur</th><th>Exemples</th></tr>
            </thead>
            <tbody>
              ${clusters.map((c) => `
                <tr>
                  <td>${esc(c.name)}</td>
                  <td>${esc(c.share_pct)}% (${esc(c.count)})</td>
                  <td>${esc(c.bpm_mean)}</td>
                  <td>${esc(c.energy_mean)}</td>
                  <td>${esc(c.valence_mean)}</td>
                  <td>${esc(c.minor_pct)}%</td>
                  <td>${esc((c.examples || []).slice(0, 2).map((f) => f.replace(/\\.mp3$/i, "")).join(" · "))}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>

        ${progressions.length ? `
        <div class="grid-2">
          <div class="card">
            <h3>Progressions d'accords (pilote)</h3>
            <div class="chart-box tall"><canvas id="chordChart"></canvas></div>
            <p class="hint">${esc(chords.coverage_note || "")}</p>
          </div>
          <div class="card">
            <h3>Exemples par progression</h3>
            <table>
              <thead><tr><th>Grille</th><th>Titres</th></tr></thead>
              <tbody>
                ${chordExamples.map((e) => `
                  <tr>
                    <td><strong>${esc(e.progression)}</strong></td>
                    <td>${esc((e.examples || []).slice(0, 2).map((f) => f.replace(/\\.mp3$/i, "")).join(" · "))}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
            <p class="hint">${esc(chords.method || "")} · ok ${esc(chords.tracks_ok)}/${esc(chords.tracks_considered)}</p>
          </div>
        </div>` : ""}

        <div class="grid-2">
          <div class="card">
            <h3>Mode</h3>
            <div class="chart-box"><canvas id="modeChart"></canvas></div>
            <p class="hint">${minor} mineur / ${major} majeur · ${minorPct}% mineur</p>
          </div>
          <div class="card">
            <h3>Instrument préféré probable</h3>
            <div class="chart-box"><canvas id="instChart"></canvas></div>
            <p class="hint">Heuristique titres · ${esc(p.instruments_untagged || 0)} non taggés</p>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>Répartition BPM</h3>
            <div class="chart-box"><canvas id="bpmChart"></canvas></div>
            <p class="hint">Médiane ${esc(p.bpm_stats?.median)} · P25–P75 : ${esc(p.bpm_stats?.p25)}–${esc(p.bpm_stats?.p75)}</p>
          </div>
          <div class="card">
            <h3>Tonalités fréquentes</h3>
            <div class="chart-box"><canvas id="keyChart"></canvas></div>
            <p class="hint">Estimation chroma</p>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>Artistes récurrents</h3>
            <div class="chart-box tall"><canvas id="artistChart"></canvas></div>
          </div>
          <div class="card">
            <h3>Signaux de style</h3>
            <div class="chart-box tall"><canvas id="genreChart"></canvas></div>
          </div>
        </div>

        <div class="warn">
          Mood / clusters = heuristiques audio. Instruments = mots-clés titres.
          Accords = pilote chroma (bruité) — pas un lead sheet Chordify.
        </div>

        <div class="card">
          <h3>Titres représentatifs du profil</h3>
          <table>
            <thead><tr><th>Piste</th><th>Tonalité</th><th>BPM</th><th>Énergie</th><th>Valence</th></tr></thead>
            <tbody>
              ${samples.map((t) => `
                <tr>
                  <td>${esc((t.file || "").replace(/\\.mp3$/i, ""))}</td>
                  <td>${esc(t.key)} ${esc(t.mode)}</td>
                  <td>${esc(t.bpm)}</td>
                  <td>${esc(t.energy ?? "—")}</td>
                  <td>${esc(t.valence ?? "—")}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>

        <footer>
          Source :
          <a href="https://github.com/rafa-create/youtube_likes_mp3">rafa-create/youtube_likes_mp3</a>
          · Données live : music_profile.json
        </footer>
      `;

      new Chart(document.getElementById("modeChart"), {
        type: "doughnut",
        data: {
          labels: ["Mineur", "Majeur"],
          datasets: [{ data: [minor, major], backgroundColor: [accent, "#3d5166"], borderWidth: 0 }],
        },
        options: { plugins: { legend: { position: "bottom" } }, cutout: "58%" },
      });

      if (quadrants.length) {
        bar("moodChart", quadrants.map((q) => q.name), quadrants.map((q) => q.count), true);
      }
      if (clusters.length) {
        bar("clusterChart", clusters.map((c) => c.name), clusters.map((c) => c.count), true);
      }
      if (progressions.length) {
        bar("chordChart", progressions.map((x) => x.name), progressions.map((x) => x.count), true);
      }
      bar("instChart", instruments.map((i) => i.name), instruments.map((i) => i.count), true);
      bar("bpmChart", bpmLabels, bpmData, false);
      bar("keyChart", keys.map((k) => k.name), keys.map((k) => k.count), true);
      bar("artistChart", artists.map((a) => a.name), artists.map((a) => a.count), true);
      bar("genreChart", genres.map((g) => g.name), genres.map((g) => g.count), true);
    }

    loadProfile()
      .then(render)
      .catch((e) => {
        document.getElementById("app").innerHTML =
          `<p class="err">Impossible de charger music_profile.json : ${esc(e.message)}</p>`;
      });
  </script>
</body>
</html>
