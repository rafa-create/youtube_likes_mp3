<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1419" />
  <title>Rafael × Bram — playlists &amp; création</title>
  <meta name="description" content="Analyse des playlists + briefs studio : Rafael (YouTube), Bram (Spotify Chill), duo." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <meta property="og:title" content="Rafael × Bram — playlists & création" />
  <meta property="og:description" content="Analyse musicale + cibles de création. Voix, guitare, tempo, langues." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rafa-create.github.io/youtube_likes_mp3/" />
  <meta property="og:image" content="https://rafa-create.github.io/youtube_likes_mp3/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://rafa-create.github.io/youtube_likes_mp3/og.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #5b9fd4;
      --accent-soft: rgba(91, 159, 212, 0.14);
      --line: #2a3542;
      --ok: #6db89a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #1a3048 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 0%, #1e2438 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 72px; }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .sub { color: var(--muted); margin: 0 0 18px; max-width: 62ch; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    #person-tabs {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 10px 0 12px;
      margin-left: -16px;
      margin-right: -16px;
      padding-left: 16px;
      padding-right: 16px;
    }
    .tab {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .tab.active {
      color: var(--text);
      border-color: rgba(91, 159, 212, 0.55);
      background: var(--accent-soft);
    }
    .panel, .subpanel { display: none; }
    .panel.active, .subpanel.active { display: block; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    @media (max-width: 700px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr !important; }
      .grid-3 { grid-template-columns: 1fr !important; }
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
    }
    .stat strong {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
      word-break: break-word;
    }
    .stat span { color: var(--muted); font-size: 0.8rem; }
    .callout {
      background: var(--accent-soft);
      border: 1px solid rgba(91, 159, 212, 0.35);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .callout.ok {
      background: rgba(109, 184, 154, 0.12);
      border-color: rgba(109, 184, 154, 0.35);
    }
    .callout.warn {
      background: rgba(212, 163, 91, 0.12);
      border-color: rgba(212, 163, 91, 0.35);
    }
    .callout h2 { margin: 0 0 6px; font-size: 0.92rem; color: var(--accent); }
    .callout.ok h2 { color: var(--ok); }
    .callout.warn h2 { color: #d4a35b; }
    .callout p { margin: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 10px; font-size: 0.92rem; font-weight: 600; }
    .chart-box { position: relative; height: 230px; }
    .chart-box.tall { height: 280px; }
    .rank { display: flex; flex-direction: column; gap: 10px; }
    .rank-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(64px, 1fr) 3.4em;
      gap: 8px;
      align-items: center;
    }
    .rank-name {
      font-size: 0.88rem;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }
    .rank-bar {
      height: 8px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
    }
    .rank-bar i {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
    }
    .rank-n {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .rank-n small { font-size: 0.68rem; opacity: 0.9; }
    @media (max-width: 700px) {
      .rank-row {
        grid-template-columns: minmax(0, 1fr) 3.4em;
        grid-template-areas: "name n" "bar bar";
        row-gap: 4px;
      }
      .rank-name { grid-area: name; font-size: 0.92rem; }
      .rank-n { grid-area: n; }
      .rank-bar { grid-area: bar; }
    }
    .hint { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }
    h2.sec {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.25rem;
      margin: 22px 0 12px;
    }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 0.78rem; }
    @media (max-width: 700px) {
      .table-wrap { overflow: visible; }
      .table-wrap thead { display: none; }
      .table-wrap tr {
        display: block;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .table-wrap td {
        display: block;
        border: 0;
        padding: 4px 0;
      }
      .table-wrap td::before {
        content: attr(data-col);
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 500;
        margin-bottom: 1px;
      }
    }
    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge.ok { color: var(--ok); border-color: rgba(109, 184, 154, 0.4); }
    .copy-btn {
      margin-top: 10px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--accent);
      border-radius: 999px;
      padding: 6px 12px;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .copy-btn.done { color: var(--ok); border-color: rgba(109, 184, 154, 0.5); }
    footer {
      margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: 0.82rem;
    }
    footer a { color: var(--accent); }
    .err { color: #f0a0a0; padding: 24px; }
    .lane strong { display: block; margin-bottom: 4px; }
    .brand {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px;
    }
    .brand-logo {
      width: 56px; height: 56px; border-radius: 14px;
      object-fit: cover; border: 1px solid var(--line);
      flex-shrink: 0;
    }
    .brand-fav {
      width: 44px; height: 44px; margin-left: auto;
      border-radius: 12px; border: 1px solid var(--line);
      flex-shrink: 0; background: #0f1419;
    }
    .brand h1 { margin: 0; font-size: clamp(1.45rem, 3.6vw, 2.1rem); }
    .cover {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 16px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .cover img, .cover .cover-mark {
      width: 96px; height: 96px; border-radius: 12px;
      object-fit: cover;
    }
    .cover-mark {
      display: flex; align-items: center; justify-content: center;
      background: #121820;
      color: var(--accent);
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.6rem; font-weight: 700;
      border: 1px solid var(--line);
    }
    .cover h2 { margin: 0 0 4px; font-size: 1.15rem; font-family: "Fraunces", Georgia, serif; }
    .cover p { margin: 0; color: var(--muted); font-size: 0.88rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip {
      font-size: 0.75rem;
      color: var(--text);
      background: var(--accent-soft);
      border: 1px solid rgba(91, 159, 212, 0.3);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .list-link { margin: -4px 0 16px; font-size: 0.88rem; }
    .list-link a { color: var(--accent); }
    @media (max-width: 700px) {
      .cover { grid-template-columns: 72px 1fr; }
      .cover img, .cover .cover-mark { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <p class="sub">Chargement…</p>
  </div>
  <script>
    const accent = "#5b9fd4";
    const muted = "#8b9aab";
    const grid = "#2a3542";
    Chart.defaults.color = muted;
    Chart.defaults.borderColor = grid;
    Chart.defaults.font.family = "'DM Sans', system-ui, sans-serif";

    const charts = [];
    function clearCharts() {
      while (charts.length) {
        try { charts.pop().destroy(); } catch (_) {}
      }
    }
    function bar(id, labels, data, horizontal = false) {
      const el = document.getElementById(id);
      if (!el || !el.offsetParent) return;
      const box = el.closest(".chart-box");
      const mobile = window.matchMedia("(max-width: 700px)").matches;
      if (horizontal && box) {
        box.style.height = Math.max(box.classList.contains("tall") ? 280 : 230, labels.length * (mobile ? 38 : 32) + 24) + "px";
      }
      charts.push(new Chart(el, {
        type: "bar",
        data: {
          labels,
          datasets: [{ label: "count", data, backgroundColor: accent, borderRadius: 6 }],
        },
        options: {
          indexAxis: horizontal ? "y" : "x",
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { beginAtZero: true, ticks: { precision: 0, font: { size: mobile ? 10 : 11 } }, grid: { display: horizontal } },
            y: {
              beginAtZero: true,
              afterFit(scale) {
                if (!horizontal) return;
                const ctx = scale.ctx;
                ctx.save();
                ctx.font = `${mobile ? 11 : 12}px ${Chart.defaults.font.family}`;
                let max = 0;
                labels.forEach((l) => { max = Math.max(max, ctx.measureText(String(l)).width); });
                ctx.restore();
                const cap = Math.floor((box?.clientWidth || 280) * (mobile ? 0.48 : 0.42));
                scale.width = Math.min(cap, Math.ceil(max) + 14);
              },
              ticks: { precision: 0, autoSkip: false, font: { size: mobile ? 11 : 12 } },
              grid: { display: !horizontal },
            },
          },
        },
      }));
    }
    function doughnut(id, labels, data) {
      const el = document.getElementById(id);
      if (!el || !el.offsetParent) return;
      charts.push(new Chart(el, {
        type: "doughnut",
        data: {
          labels,
          datasets: [{ data, backgroundColor: [accent, "#3d5166", "#6db89a", "#d4a35b", "#8b9aab"], borderWidth: 0 }],
        },
        options: { plugins: { legend: { position: "bottom" } }, cutout: "58%" },
      }));
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }
    function tbl(headers, rows) {
      const col = (i) => String(headers[i] || "").replace(/<[^>]+>/g, "").replace(/"/g, "&quot;");
      return `<div class="table-wrap"><table>
        <thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td data-col="${col(i)}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
    }
    const BRIEFS = {};
    function copyBtn(id, text) {
      BRIEFS[id] = text;
      return `<button type="button" class="copy-btn" data-brief="${esc(id)}">Copier le brief</button>`;
    }
    function rankHtml(items, total) {
      const max = Math.max(...items.map((x) => x.n), 1);
      return `<div class="rank">${items.map((x) => {
        const pct = total ? `${(100 * x.n / total).toFixed(1).replace(".", ",")}%` : "";
        return `
        <div class="rank-row">
          <span class="rank-name">${esc(x.name)}</span>
          <span class="rank-bar"><i style="width:${((100 * x.n) / max).toFixed(1)}%"></i></span>
          <span class="rank-n">${x.n}${pct ? `<small>${pct}</small>` : ""}</span>
        </div>`;
      }).join("")}</div>`;
    }

    async function loadProfile() {
      const urls = [
        "./music_profile.json",
        "music_profile.json",
        "https://raw.githubusercontent.com/rafa-create/youtube_likes_mp3/main/music_profile.json",
      ];
      let lastErr;
      for (const url of urls) {
        try {
          const sep = url.includes("?") ? "&" : "?";
          const res = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error(res.status + " " + url);
          return await res.json();
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("profil introuvable");
    }

    const GAYTITUDE = {
      rafael: {
        score: 81, label: "Sensitive-pop (quartile supérieur)",
        rows: [
          ["Mode mineur (58%)", "16.2", "423/726 pistes mineures — couleur introspective"],
          ["Soft vocals / piano / chanson", "18.5", "Voix 108 + piano 49 + FR chanson 33 + neo-classical 44"],
          ["Artistes sensibles", "17.2", "Sia, Pomme, HAEVN, Tom Odell, Alec Benjamin, Sheeran…"],
          ["Moods mélancoliques", "15.0", "Intime/sombre + électro-mélancolie ≈ 45% des quadrants"],
          ["Anti-club (100−hard)", "14.1", "EDM présent mais pas dominant vs émotion midtempo"],
        ],
      },
      bram: {
        score: 57, label: "Chill-acoustic (quartile médian)",
        rows: [
          ["Soft acoustic / intimacy", "18.0", "Guitare + voix soft = cœur Chill (Johnson, Bahamas, Mayer)"],
          ["Artistes sensibles", "11.0", "Froukje / Mayer / Jeangu — mais Johnson = craft guitare, pas drama-pop"],
          ["Tempo lent émotionnel", "14.0", "~90 BPM → écoute corporelle douce, pas flex"],
          ["Blues/soul vulnerability", "8.0", "Keb' Mo', Kiwanuka-adjacent pocket"],
          ["Anti-club", "6.0", "Quasi zéro EDM — le « dude with a guitar » baisse le score gay-coded"],
        ],
      },
      duo: {
        score: 69, label: "Profil mixte, biais émotionnel",
        rows: [
          ["Moyenne pondérée R/B", "69.0", "0.6×81 (Rafael) + 0.4×57 (Bram) — Rafael tire vers sensitive-pop"],
        ],
      },
    };

    function gaytitudeHtml(who) {
      const g = GAYTITUDE[who];
      return `
        <h2 class="sec">Indice de Gaytitude (IG)</h2>
        <div class="stats">
          <div class="stat"><strong>${g.score}%</strong><span>Score composite IG</span></div>
          <div class="stat"><strong>${esc(g.label)}</strong><span>Classe d’écoute</span></div>
        </div>
        <div class="callout">
          <h2>Définition opérationnelle</h2>
          <p>L’IG mesure l’affinité d’un corpus pour un répertoire <em>sensitive</em> : mode mineur, voix/piano, artistes à charge émotionnelle élevée, moods mélancoliques, faible densité club/EDM. C’est un indice d’écoute, calibré sur des marqueurs culturels du « gay listening » et de la <em>sensitive female / male lead</em> en pop contemporaine.</p>
        </div>
        <p class="hint">Cinq composantes pondérées. Le hard-club et l’acoustic « beach bro » réduisent le score ; le midtempo émotionnel et la chanson l’augmentent.</p>
        <div class="card">
          <h3>Décomposition du score</h3>
          ${tbl(["Composante", "Pts /100", "Contribution observée"], g.rows.map((r) => [esc(r[0]), r[1], esc(r[2])]))}
          <p class="hint">IG = 0.28·Mineur% + 0.22·SoftVocals + 0.20·ArtistesSensibles + 0.15·MoodMélancolique + 0.15·(100−ClubHard). Échelle 0–100, arrondi à l’entier.</p>
        </div>`;
    }

    function render(p) {
      const chords = p.chord_progressions || {};
      const recipes = (chords.creation_recipes || []).slice(0, 6);
      const loops = (chords.top_chord_loops || []).slice(0, 6);
      const langs = (chords.languages || []).slice(0, 5);
      const romans = (chords.top_progressions || []).slice(0, 6);
      const bram = p.bram || {};
      const bArtists = (bram.top_artists || []).slice(0, 10);
      const rArtists = (p.top_artists || []).slice(0, 8);
      const rGenres = (p.genre_signals || []).filter((g) => !/autre/i.test(g.name)).slice(0, 7);
      const rKeys = (p.keys || []).slice(0, 6);
      const rInst = (p.instruments || []).slice(0, 5);
      const rMood = ((p.mood || {}).quadrants || []).slice(0, 5);
      const playlistN = p.playlist_count || 776;
      const audioN = p.mp3_count || 726;

      document.getElementById("app").innerHTML = `
        <div class="brand">
          <img class="brand-logo" src="./logo.jpg" width="56" height="56" alt="Logo Rafael × Bram" />
          <div>
            <h1>Rafael × Bram</h1>
            <p class="sub" style="margin:4px 0 0">Playlists · analyse · création</p>
          </div>
          <img class="brand-fav" src="./favicon.svg" width="44" height="44" alt="" />
        </div>

        <div class="tabs" id="person-tabs">
          <button class="tab active" data-person="rafael">Rafael</button>
          <button class="tab" data-person="bram">Bram</button>
          <button class="tab" data-person="duo">À deux</button>
        </div>

        <div class="panel active" id="person-rafael">
          <div class="stats">
            <div class="stat"><strong>776</strong><span>Likes YT</span></div>
            <div class="stat"><strong>726</strong><span>MP3 analysés</span></div>
            <div class="stat"><strong>~118</strong><span>BPM médian</span></div>
            <div class="stat"><strong>81%</strong><span>Gaytitude IG</span></div>
          </div>
          <p class="list-link"><a href="./liste_rafael.md">Liste brute des 776 titres</a> — une ligne par morceau, prêt à copier-coller</p>
          <div class="tabs" id="rafael-mode-tabs">
            <button class="tab" data-sub="rafael-analyse">Analyse playlist</button>
            <button class="tab active" data-sub="rafael-creation">Création artistique</button>
          </div>

          <div class="subpanel" id="rafael-analyse">
            <div class="cover">
              <div class="cover-mark">R</div>
              <div>
                <h2>Fiche d’écoute — Rafael</h2>
                <p>Likes YouTube · 726 MP3 (librosa) · émotion > genre</p>
                <div class="chips">
                  <span class="chip">~118 BPM</span>
                  <span class="chip">58% mineur</span>
                  <span class="chip">voix vulnérables</span>
                  <span class="chip">piano / ciné</span>
                  <span class="chip">électro mélodique</span>
                  <span class="chip">covers</span>
                </div>
              </div>
            </div>
            <div class="callout">
              <h2>Verdict playlist Rafael</h2>
              <p>Moins un genre qu’un <strong>état</strong> : nostalgie + espace + intensité douce. Les genres divergent (Walker, Einaudi, Billie, Sia, Zimmer) mais convergent. Signature : <strong>intimité → espace → montée → émotion</strong>. « Donne-moi une musique qui me fait voyager quelque part où je ne suis jamais allé. »</p>
              <p class="hint" style="margin-top:8px">Deux piliers : <strong>cinéma / piano</strong> et <strong>électro mélodique</strong> — rarement du club pur. La production <strong>ouvre un espace</strong>. La voix est fragile, intime. La langue passe après l’atmosphère.</p>
            </div>

        <div class="panel" id="person-duo">
          <div class="stats">
            <div class="stat"><strong>100–108</strong><span>BPM pont</span></div>
            <div class="stat"><strong>EN / NL / FR</strong><span>Langues</span></div>
            <div class="stat"><strong>69%</strong><span>Gaytitude duo</span></div>

          <p class="list-link"><a href="./liste_rafael.md">Liste Rafael</a> · <a href="./liste_bram.md">Liste Bram</a> — brut, prêt à copier-coller</p>
          <div class="callout">
            <h2>Objectif duo</h2>
            <p>Terrain commun = <strong>créer un monde</strong>, pas le même mécanisme. Rafael : mélodie → espace → émotion (~118). Bram : rythme → groove → chaleur (~90). Rencontre à <strong>100–108 BPM</strong>, voix + guitare. Langues : EN ensemble, NL côté Bram, FR côté Rafael.</p>

          <div class="tabs" id="duo-tabs">
            <button class="tab" data-sub="duo-overlap">Analyse croisée</button>

            <button class="tab active" data-sub="duo-concepts">Concepts</button>

          <div class="subpanel" id="duo-overlap">
            <div class="cover">
              <img src="./logo.jpg" width="96" height="96" alt="" />
              <div>
                <h2>À deux — terrain commun</h2>
                <p>Deux ambiances · NL × FR · 100–108 BPM</p>
                <div class="chips">
                  <span class="chip">nuit × soleil</span>
                  <span class="chip">voix + guitare</span>
                  <span class="chip">EN ensemble</span>
                  <span class="chip">NL Bram · FR Rafael</span>

            </div>
            ${gaytitudeHtml("duo")}
            <div class="card"><h3>IG comparé</h3><div class="chart-box"><canvas id="duoIg"></canvas></div>
              <p class="hint">Rafael tire vers sensitive-pop (nuit) ; Bram ramène vers groove solaire. Ensemble = émotion accessible, pas club.</p>

            <h2 class="sec">Comparaison playlist → création</h2>
            ${tbl(["Axe", "Rafael", "Bram", "Pont duo"], [
              ["Cœur", "Émotion + espace + montée", "Sensation + groove + chaleur", "Un monde, deux mécaniques"],

            <div class="grid-2">
              <div class="card"><h3>Tempo — zone de rencontre</h3><div class="chart-box"><canvas id="duoBpm"></canvas></div><p class="hint">Rafael mesuré · Bram estimé · pont 100–108</p></div>
              <div class="card"><h3>Grilles communes</h3>
                <p><strong>C – G – Am – F</strong><br><span class="hint">Bram campfire · Rafael I–V–vi–IV</span></p>
                <p><strong>Am – F – C – G</strong><br><span class="hint">Rafael vi–IV–I–V · Bram ballade mineure</span></p>
                <p><strong>G – Em – C – D</strong><br><span class="hint">Bram island · Rafael arpèges synth</span></p>
              </div>
            </div>
            <div class="callout ok">
              <h2>Style croisé qui résonne</h2>
              <p><strong>Rafael :</strong> « Donne-moi une musique qui me fait voyager quelque part où je ne suis jamais allé. » <strong>Bram :</strong> « Donne-moi une musique qui me donne envie de rester exactement là où je suis. » Même envie d’un monde ; Rafael le construit en mélodie/espace, Bram en rythme/chaleur. Pont in-playlist : <em>Texas Sun</em>. Pont hors liste : Ben Howard — <em>Old Pine</em>.</p>
            </div>

              <h3>Pont hors listes</h3>

              <p class="hint">Rafael → Ólafur Arnalds (<em>Near Light</em>) · Bram → approfondir Ben Harper / Leon Bridges (déjà en collab) puis Ben Howard en vrai absent.</p>
            </div>
          </div>

          <div class="subpanel" id="duo-roles">
            ${tbl(["Domaine", "Bram mène", "Rafael mène", "Ensemble"], [
              ["Guitare / skeleton", "Oui", "Doubles / soutien", "Grille fixée à 2"],
              ["Beat / groove", "Shaker, brush", "Kick/clap électro", "Layer progressif"],
              ["Synth / pads", "Rare", "Oui — atmosphère", "Entre au 2e couplet"],
              ["Voix lead", "Soft / grain", "Pop / stacks", "Duo refrain"],

              ["Paroles FR", "Support", "Oui (pont)", "4–8 barres max v1"],

            ])}
            <div class="grid-2">
              <div class="card"><h3>Leadership Bram</h3><p>Groove organique, mer / route, blues soft, tempo lent, guitare, lyrics du quotidien, le corps d’abord.</p></div>
              <div class="card"><h3>Leadership Rafael</h3><p>Couleur 4 chords pop, synth/piano, arrangement, énergie mid, option FR, finish streaming.</p></div>
            </div>
            <h2 class="sec">Pièges duo</h2>
            ${tbl(["Piège", "Fix"], [
              ["128 BPM EDM d’emblée", "Cap ~110 sur la v1"],

              ["FR sur tout le titre", "FR = pont / ad-lib seulement"],
            ])}
          </div>

          <div class="subpanel" id="duo-session">
            <h2 class="sec">Session type — 90 minutes</h2>
            ${tbl(["Min", "Action", "Qui", "Livrable"], [
              ["0–10", "Choisir grille + BPM 104", "2", "C–G–Am–F noté"],

              ["40–55", "Pad + kick soft + delay", "Rafael", "Lift audible"],
              ["55–70", "Paroles EN + test FR pont", "2", "8+4 lignes"],
              ["70–85", "Arrange verse dry / chorus wet", "Rafael", "Diff sections"],
              ["85–90", "Export rough + notes", "2", "WAV + grille/BPM"],
            ])}
            <div class="callout ok">
              <h2>Double test de réussite</h2>
              <p>1) Sans synth, la chanson tient (Bram). 2) Sans guitare, émotion/prod tient (Rafael). Les deux doivent passer avant de figer.</p>

          <div class="subpanel active" id="duo-concepts">
            <h2 class="sec">Concepts prêts à composer</h2>
            <div class="grid-3">
              <div class="card"><h3>1 — Late light</h3><p><strong>C–G–Am–F · 104 BPM · EN</strong></p><p>Bram fingerstyle C. Rafael pad + clap. Refrain duo.</p><p class="hint">Lyric : « leave the porch light on for me… »</p>${copyBtn("d1", "Duo — Late light\nC–G–Am–F · 104 BPM · EN\nBram fingerstyle C. Rafael pad + clap. Refrain duo.\nLyric : leave the porch light on for me…")}</div>
              <div class="card"><h3>2 — Warm minor</h3><p><strong>Am–F–C–G · 100 BPM · EN + FR pont</strong></p><p>Plus « Rafael émotion ». Bram Am fingerstyle. Pont FR 4–8 barres.</p><p class="hint">Lyric : « we talk in circles around the quiet… »</p>${copyBtn("d2", "Duo — Warm minor\nAm–F–C–G · 100 BPM · EN + FR pont\nBram Am fingerstyle. Rafael émotion. Pont FR 4–8 barres.\nLyric : we talk in circles around the quiet…")}</div>

        <footer>
          Sources : likes YouTube Rafael (726 MP3, librosa) · Spotify Chill Bram (270 titres) · IG = indice composite pondéré (0–100).
          <a href="https://github.com/rafa-create/youtube_likes_mp3">repo</a>
        </footer>
      `;

      function showPerson(name, skipHash) {
        document.querySelectorAll("#person-tabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.person === name));
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "person-" + name));
        paintCharts();
        if (!skipHash) {
          const sub = document.querySelector("#person-" + name + " .subpanel.active")?.id;
          if (sub) history.replaceState(null, "", "#" + sub);
        }
      }
      function showSub(id, tabGroup, skipHash) {
        const group = document.getElementById(tabGroup);
        group.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.sub === id));
        const person = group.closest(".panel");
        person.querySelectorAll(".subpanel").forEach((s) => s.classList.toggle("active", s.id === id));
        paintCharts();
        if (!skipHash) history.replaceState(null, "", "#" + id);
      }

      const SUB_TO_PERSON = {
        "rafael-analyse": "rafael", "rafael-creation": "rafael",
        "bram-analyse": "bram", "bram-creation": "bram",
        "duo-overlap": "duo", "duo-roles": "duo", "duo-session": "duo", "duo-concepts": "duo",
      };
      const PERSON_TABS = {
        rafael: "rafael-mode-tabs",
        bram: "bram-mode-tabs",
        duo: "duo-tabs",
      };
      function applyHash() {
        const id = (location.hash || "").replace(/^#/, "");
        const person = SUB_TO_PERSON[id];
        if (!person) return;
        showPerson(person, true);
        showSub(id, PERSON_TABS[person], true);
      }

      document.querySelectorAll("#person-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => showPerson(btn.dataset.person));
      });
      document.querySelectorAll("#rafael-mode-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => showSub(btn.dataset.sub, "rafael-mode-tabs"));
      });
      document.querySelectorAll("#bram-mode-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => showSub(btn.dataset.sub, "bram-mode-tabs"));
      });
      document.querySelectorAll("#duo-tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => showSub(btn.dataset.sub, "duo-tabs"));
      });

      function paintCharts() {
        clearCharts();
        const person = document.querySelector(".panel.active")?.id;
        const sub = document.querySelector(".panel.active .subpanel.active")?.id;
        if (person === "person-rafael" && sub === "rafael-analyse") {
          doughnut("rMode", ["Mineur", "Majeur"], [423, 303]);
          bar("rBpm", ["<80", "80–100", "100–120", "120–140", "140+"], [54, 145, 126, 175, 117]);
        }
        if (person === "person-bram" && sub === "bram-analyse") {
          doughnut("bOrigin", ["US/UK/CA", "NL / Benelux", "DE", "World / autre"], [38, 14, 3, 8]);
          doughnut("bLang", ["EN (titres US/UK)", "NL", "DE", "FR", "ES / world"], [210, 22, 8, 12, 18]);
        }
        if (person === "person-duo" && sub === "duo-overlap") {
          bar("duoIg", ["Bram", "Duo", "Rafael"], [57, 69, 81]);
          bar("duoBpm", ["Bram ~90", "Duo ~104", "Rafael ~118"], [90, 104, 118]);
        }
      }
      applyHash();
      window.addEventListener("hashchange", applyHash);
      requestAnimationFrame(paintCharts);
    }

    document.getElementById("app").addEventListener("click", async (e) => {
      const btn = e.target.closest(".copy-btn");
      if (!btn) return;
      const text = BRIEFS[btn.dataset.brief];
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = "Copié";
        btn.classList.add("done");
        setTimeout(() => {
          btn.textContent = "Copier le brief";
          btn.classList.remove("done");
        }, 1600);
      } catch (_) {
        btn.textContent = "Échec";
      }
    });

    loadProfile()
      .then(render)
      .catch((e) => {
        document.getElementById("app").innerHTML =
          `<p class="err">Impossible de charger music_profile.json : ${esc(e.message)}</p>`;
      });
  </script>
